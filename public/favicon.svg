<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#dark-bg)" stroke="url(#logo-gradient)" stroke-width="2.5" />
  
  <!-- Subtle geometric accent lines -->
  <circle cx="50" cy="14" r="3" fill="#f59e0b" opacity="0.8" />
  <path d="M12 48 L22 48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  
  <!-- Monogram AC -->
  <g fill="none" stroke="url(#logo-gradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter A -->
    <path d="M19 44 L28 18 L37 44" stroke-width="4.2" />
    <path d="M23.5 35 L32.5 35" stroke-width="3.5" />
    
    <!-- Letter C overlapping / nested -->
    <path d="M49 26 C46 20, 36 20, 34 31 C32 40, 42 45, 49 39" stroke-width="4.2" />
  </g>
</svg>
